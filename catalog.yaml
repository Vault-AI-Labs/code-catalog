# Pristine release-owned Code model catalog, never copied from an operator's model registry.
# Every entry was loaded and measured on VaultAI's owned Ollama 0.34.2 with the Code launch policy
# (one runner, q8_0 KV cache, flash attention) at each launch context, on a 512 GB Mac.
# v3 (2026-09-22): coding moved to the MLX build of Qwen3.8 27B (ruling 2026-09-21 evening;
# 73-88 tok/s vs ~30 GGUF). Qwen3-Coder-30B-A3B dropped (ruling 2) and the VaultAI GGUF build of
# the same model superseded. MLX runners allocate the KV cache lazily, so an MLX entry's
# measurement prefills roughly a full context before reading /api/ps - an empty load would
# report weights only. GGUF runners pre-allocate, so their readings need no prefill.
# Rig and raw output: max-code-lab Documentation/validation/model-onboarding-2026-09-21/.
# Residency is what /api/ps reported (size == size_vram); disk bytes were never used as runtime RAM.
# Digests are engine manifest identities, checked the same day against the publishing registry.
#
# Hardware analysis. A model lists a RAM class only when, at that class's launch context,
#   measured residency + OS reserve (RAM/8, 2–16 GiB) <= 70 % of the class
# which a test recomputes from the numbers below. Classes are "from N GB up".
